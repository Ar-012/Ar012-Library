<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Library | 访问授权</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
</head>
<body class="password-page">
    <div class="password-container">
        <div class="password-box">
            <div class="password-header">
                <i class="fas fa-lock"></i>
                <h1>AR Library</h1>
                <p class="password-subtitle">Authorization required</p>
            </div>
            
            <div class="password-form">
                <div class="input-group">
                    <i class="fas fa-key"></i>
                    <input type="password" id="password-input" placeholder="请输入访问密码" maxlength="4">
                </div>
                <button id="password-submit" class="password-btn">
                    <i class="fas fa-unlock"></i> 进入网站
                </button>
            </div>
            
            <div class="password-hint">
                <p><i class="fas fa-info-circle"></i> 这是个人工作资源库，仅限授权访问</p>
                <p><i class="fas fa-lightbulb"></i> 密码提示：四位数，站主生日</p>
            </div>
            
            <div class="password-footer">
                <p>© AR Library</p>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password-input');
            const submitBtn = document.getElementById('password-submit');
            
            // 提交密码
            submitBtn.addEventListener('click', function() {
                checkPassword();
            });
            
            // 按Enter键提交
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkPassword();
                }
            });
            
            // 密码验证函数
            function checkPassword() {
                const password = passwordInput.value;
                
                if (password === '0112') {
                    // 保存验证状态到本地存储
                    localStorage.setItem('ar_library_authenticated', 'true');
                    // 跳转到主页
                    window.location.href = 'index.html';
                } else {
                    // 密码错误效果
                    passwordInput.classList.add('error');
                    passwordInput.value = '';
                    passwordInput.placeholder = '密码错误，请重试';
                    
                    // 移除错误效果
                    setTimeout(() => {
                        passwordInput.classList.remove('error');
                        passwordInput.placeholder = '请输入访问密码';
                    }, 1000);
                }
            }
            
            // 自动聚焦到密码输入框
            passwordInput.focus();
        });
    </script>
</body>
</html>
