<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Library | 个人资源与配置库</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme-arc.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Sans+Pro:wght@300;400&display=swap" rel="stylesheet">

<body data-auth="protected">
    <div id="sidebar"></div>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="container">
            <!-- 简洁的主页内容 -->
            <div class="simple-home">
                <!-- 名言区域 -->
                <div class="quote-section">
                    <div class="quote-box">
                        <div class="quote-icon">
                            <i class="fas fa-quote-left"></i>
                        </div>
                        <h1 class="quote-text">个人资源与配置库</h1>

                    </div>
                </div>
                
                <!-- 个人笔记区域 -->
                <div class="notes-section">
                    <div class="notes-box">
                        <h2><i class="fas fa-pen"></i>资源与配置</h2>
                        <div class="notes-content">
                            <p>以后我还会用到什么？怎样快速重新找到、打开或恢复它？</p>
                            <ul>
                                <li>整理外部资源、软件、插件与扩展</li>

                            </ul>
                        </div>
                    </div>
                    
                    <div class="quick-stats">
                        <div class="stat-item">
                            <i class="fas fa-calendar"></i>
                            <div class="stat-text">
                                <h3>2026.09.27</h3>
                                <p>最后更新</p>
                            </div>
                        </div>
                    </div>





                </div>

            </div>
        </div>
        
        <!-- 简洁页脚 -->
        <footer class="simple-footer">
            <div class="container">

            </div>

</html>
